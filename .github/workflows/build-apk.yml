name: Build Atiran Hamrah Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35 / build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ] && [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMAN="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          if [ -x "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            "$SDKMAN" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Build debug APK
        working-directory: AtiranHamrahViewer
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon --stacktrace --console=plain > build.log 2>&1
          echo "EXIT_CODE=$?" >> build.log
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: AtiranHamrahViewer/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AtiranHamrahViewer-debug-apk
          path: |
            AtiranHamrahViewer/app/build/outputs/apk/debug/*.apk
            AtiranHamrahViewer/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: ignore

      - name: Verify build succeeded
        run: grep -q '^EXIT_CODE=0$' AtiranHamrahViewer/build.log

      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'PY'
          log = open("AtiranHamrahViewer/build.log").read()
          lines = log.splitlines()
          start = next((i for i, l in enumerate(lines) if "Task :app:compileDebugKotlin" in l), 0)
          part = lines[start:start + 120] if start else lines[-120:]
          msg = "Android build failed. Compile output:\n" + "\n".join(part)
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print("::error::" + msg)
          PY

      - name: Publish build diagnostic issue
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('AtiranHamrahViewer/build.log', 'utf8');
            const lines = log.split('\n');
            let start = lines.findIndex(l => l.includes("Task :app:compileDebugKotlin"));
            const body = start >= 0 ? lines.slice(start, start + 800).join('\n') : lines.slice(-800).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Android build diagnostic ${context.runId}`,
              body: body
            });
